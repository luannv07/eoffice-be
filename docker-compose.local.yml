services:
  postgres:
    image: postgres:16
    container_name: eoffice-postgres-local
    restart: unless-stopped
    environment:
      POSTGRES_DB: eoffice
      POSTGRES_USER: eoffice
      POSTGRES_PASSWORD: luannv@8ck
    ports:
      - "5432:5432"
    volumes:
      - postgres_local_data:/var/lib/postgresql/data

volumes:
  postgres_local_data:
