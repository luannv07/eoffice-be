spring:
  config:
    import:
      - optional:file:.env.staging[.properties]
      - optional:file:.env.deploy[.properties]
  application:
    name: eoffice-be
  jackson:
    time-zone: UTC
  jpa:
    properties:
      hibernate:
        jdbc:
          batch_size: 50
          time_zone: UTC
        order_inserts: true
        order_updates: true
        jdbc.batch_versioned_data: true
        generate_statistics: false
  profiles:
    active: staging
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/master.yml

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha

