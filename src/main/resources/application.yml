spring:
  config:
    import:
      - optional:file:.env.staging[.properties]
      - optional:file:.env.deploy[.properties]
  application:
    name: eoffice-be
    version: @project.version@
  jackson:
    time-zone: UTC
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate:
        jdbc:
          batch_size: 50
          time_zone: UTC
        order_inserts: true
        order_updates: true
        jdbc.batch_versioned_data: true
        generate_statistics: false
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:staging}
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/master.yml
  logging:
    level:
      liquibase: INFO
      root: INFO

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

eoffice:
  storage:
    base-path: ${STORAGE_BASE_PATH:./uploads}
  jwt:
    issuer: eoffice-be
    secret-key: ${JWT_SECRET}
    access-token-ttl: ${JWT_ACCESS_TTL:PT15M}
    refresh-token-ttl: ${JWT_REFRESH_TTL:P30D}
    auth-rate-limit: 10
    auth-rate-window-seconds: 300
    cookie-name: refresh_token
    cookie-path: ${COOKIE_PATH:/auth}
    cookie-secure: ${COOKIE_SECURE:false}
    cookie-same-site: Strict
    allowed-origins: ${JWT_ALLOWED_ORIGINS:}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
