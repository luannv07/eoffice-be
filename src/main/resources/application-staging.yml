spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:ip-host}:${DB_PORT:5432}/${DB_NAME:eoffice}?options=-c%20TimeZone%3DUTC
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false

    properties:
      hibernate:
        jdbc:
          batch_size: 100
          time_zone: UTC
        order_inserts: true
        order_updates: true
        jdbc.batch_versioned_data: true

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/master.yml

server:
  port: ${PORT:8080}
  servlet:
    context-path: ${SERVER_CONTEXT_PATH:/api/v1}

logging:
  level:
    liquibase: INFO
