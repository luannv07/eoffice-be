databaseChangeLog:
  # Fix document_books HTTP 500: duplicate key document_books_pkey.
  # document_books_seq (or document_books_id_seq) drifted behind max(id) after seed data
  # inserted records with fixed IDs (6001..6005). Resync sequence to max(id) + 50.
  - changeSet:
      id: 2026-10-10-resync-document-books-sequence-pg
      author: eoffice-dev
      dbms: postgresql
      validCheckSum:
        - ANY
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |-
              SELECT setval(c.oid, GREATEST((SELECT COALESCE(MAX(id), 0) FROM document_books), 10000) + 50, false)
              FROM pg_class c
              WHERE c.relkind = 'S' AND c.relname IN ('document_books_seq', 'document_books_id_seq');
      rollback:
        - sql:
            sql: SELECT 1

  - changeSet:
      id: 2026-10-10-resync-document-books-sequence-h2
      author: eoffice-dev
      dbms: h2
      changes:
        - sql:
            sql: ALTER SEQUENCE IF EXISTS document_books_seq RESTART WITH 10050
      rollback:
        - sql:
            sql: SELECT 1
