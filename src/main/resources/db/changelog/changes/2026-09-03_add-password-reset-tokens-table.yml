databaseChangeLog:
  - changeSet:
      id: 2026-09-03-add-password-reset-tokens-table
      author: luannv
      preConditions:
        onFail: MARK_RAN
        not:
          tableExists:
            tableName: password_reset_tokens
      changes:
        - createTable:
            tableName: password_reset_tokens
            remarks: Lưu token đặt lại mật khẩu dạng hash, dùng một lần và có thời hạn
            columns:
              - column:
                  name: id
                  type: BIGINT
                  defaultValueComputed: nextval('hibernate_sequence')
                  remarks: Khóa chính tự sinh của bản ghi
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_login_id
                  type: BIGINT
                  remarks: FK tới user_logins - tài khoản yêu cầu đặt lại mật khẩu
                  constraints:
                    nullable: false
              - column:
                  name: token_hash
                  type: VARCHAR(64)
                  remarks: Hash của token đặt lại mật khẩu
                  constraints:
                    nullable: false
              - column:
                  name: expires_at
                  type: TIMESTAMP WITH TIME ZONE
                  remarks: Thời điểm token hết hạn
                  constraints:
                    nullable: false
              - column:
                  name: used_at
                  type: TIMESTAMP WITH TIME ZONE
                  remarks: Thời điểm token được sử dụng
              - column:
                  name: delete_flg
                  type: BOOLEAN
                  defaultValueBoolean: false
                  remarks: Cờ xóa mềm
                  constraints:
                    nullable: false
              - column:
                  name: created_by
                  type: VARCHAR(255)
                  remarks: Người tạo (audit)
              - column:
                  name: created_date
                  type: TIMESTAMP WITH TIME ZONE
                  remarks: Thời điểm tạo (audit)
                  constraints:
                    nullable: false
              - column:
                  name: updated_by
                  type: VARCHAR(255)
                  remarks: Người cập nhật (audit)
              - column:
                  name: updated_date
                  type: TIMESTAMP WITH TIME ZONE
                  remarks: Thời điểm cập nhật (audit)

        - addUniqueConstraint:
            constraintName: uq_password_reset_tokens_token_hash
            tableName: password_reset_tokens
            columnNames: token_hash

        - createIndex:
            indexName: idx_password_reset_tokens_user_login
            tableName: password_reset_tokens
            columns:
              - column:
                  name: user_login_id

        - createIndex:
            indexName: idx_password_reset_tokens_expires_at
            tableName: password_reset_tokens
            columns:
              - column:
                  name: expires_at

        - addForeignKeyConstraint:
            baseTableName: password_reset_tokens
            baseColumnNames: user_login_id
            constraintName: fk_password_reset_tokens_user_login
            referencedTableName: user_logins
            referencedColumnNames: id
      rollback:
        - dropTable:
            tableName: password_reset_tokens
