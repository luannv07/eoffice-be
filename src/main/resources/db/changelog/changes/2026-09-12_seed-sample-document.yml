databaseChangeLog:
  - changeSet:
      id: 2026-09-12-seed-sample-org-and-document
      author: dev
      preConditions:
        - onFail: MARK_RAN
        - sqlCheck:
            expectedResult: 0
            sql: "SELECT COUNT(*) FROM documents WHERE id = 2"
      changes:
        # 1. Tạo tài khoản Admin mới (Username: admin2 / Pass: Admin@1234)
        - insert:
            tableName: user_logins
            columns:
              - column: { name: id, valueNumeric: 2001 }
              - column: { name: username, value: 'admin2' }
              - column: { name: password_hash, value: '$2a$10$wJtK1f3r6H6/w5xT1Lg/8OB1tS5y.U.YcEqx4Pq1mZ3v3s1k8K8Qe' }
              - column: { name: role, value: 'ADMIN' }
              - column: { name: user_status_cd, value: 'ACTIVE' }
              - column: { name: must_change_password, valueBoolean: false }
              - column: { name: failed_login_attempts, valueNumeric: 0 }
              - column: { name: delete_flg, valueBoolean: false }

        # 2. Tạo thông tin hồ sơ cho admin2 (để không bị lỗi PROFILE_INCOMPLETE)
        - insert:
            tableName: user_infos
            columns:
              - column: { name: id, valueNumeric: 2101 }
              - column: { name: user_login_id, valueNumeric: 2001 }
              - column: { name: full_name, value: 'Quản Trị Viên Mới' }
              - column: { name: employment_status_cd, value: 'ACTIVE' }
              - column: { name: delete_flg, valueBoolean: false }

        # 3. Tạo đơn vị ban hành mẫu
        - insert:
            tableName: org_nodes
            columns:
              - column: { name: id, valueNumeric: 100 }
              - column: { name: code, value: 'BGH' }
              - column: { name: name_vn, value: 'Ban Giám hiệu' }
              - column: { name: name_en, value: 'Board of Rectors' }
              - column: { name: type_cd, value: 'DEPARTMENT' }
              - column: { name: org_order, valueNumeric: 1 }
              - column: { name: delete_flg, valueBoolean: false }
              - column: { name: created_by, value: 'system' }

        # 4. Tạo văn bản mẫu số 2 (Trạng thái SUBMITTED để test luồng)
        - insert:
            tableName: documents
            columns:
              - column: { name: id, valueNumeric: 2 }
              - column: { name: title, value: 'Quyết định về việc ban hành quy chế đào tạo năm học 2026-2027' }
              - column: { name: document_type_cd, value: 'QUYET_DINH' }
              - column: { name: issuing_org_id, valueNumeric: 100 }
              - column: { name: drafter_id, valueNumeric: 2001 }
              - column: { name: signer_id, valueNumeric: 2001 }
              - column: { name: urgency_level_cd, value: 'NORMAL' }
              - column: { name: security_level_cd, value: 'NORMAL' }
              - column: { name: status, value: 'SUBMITTED' }
              - column: { name: recipients_text, value: 'Các phòng ban, khoa đào tạo' }
              - column: { name: primary_file_path, value: 'sample.pdf' }
              - column: { name: delete_flg, valueBoolean: false }
              - column: { name: created_by, value: 'admin2' }