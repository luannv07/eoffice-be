databaseChangeLog:
  - changeSet:
      id: 2026-09-11-create-table-documents
      author: quyet
      preConditions:
        onFail: MARK_RAN
        sqlCheck:
          expectedResult: 0
          sql: "SELECT COUNT(*) FROM information_schema.tables WHERE LOWER(table_name) = 'documents'"
      changes:
        - createTable:
            tableName: documents
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: title
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: official_number
                  type: VARCHAR(100)
              - column:
                  name: status
                  type: VARCHAR(50)
                  defaultValue: DRAFT
                  constraints:
                    nullable: false
              - column:
                  name: issue_date
                  type: DATE
              - column:
                  name: effective_date
                  type: DATE
              - column:
                  name: official_file_path
                  type: VARCHAR(500)
              - column:
                  name: official_hash
                  type: VARCHAR(64)
              - column:
                  name: created_date
                  type: TIMESTAMP
              - column:
                  name: updated_date
                  type: TIMESTAMP

  - changeSet:
      id: 2026-09-11-add-missing-publish-columns
      author: antigravity
      preConditions:
        onFail: MARK_RAN
        sqlCheck:
          expectedResult: 0
          sql: "SELECT COUNT(*) FROM information_schema.columns WHERE LOWER(table_name) = 'documents' AND LOWER(column_name) = 'official_number'"
      changes:
        - addColumn:
            tableName: documents
            columns:
              - column:
                  name: official_number
                  type: VARCHAR(100)
              - column:
                  name: issue_date
                  type: DATE
              - column:
                  name: effective_date
                  type: DATE
              - column:
                  name: official_file_path
                  type: VARCHAR(500)
              - column:
                  name: official_hash
                  type: VARCHAR(64)

  - changeSet:
      id: 2026-09-11-create-table-document-distribution
      author: quyet
      validCheckSum: ANY
      preConditions:
        onFail: MARK_RAN
        sqlCheck:
          expectedResult: 0
          sql: "SELECT COUNT(*) FROM information_schema.tables WHERE LOWER(table_name) = 'document_distributions'"
      changes:
        - createTable:
            tableName: document_distributions
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: document_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: target_id
                  type: BIGINT
              - column:
                  name: target_type
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: is_read
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: read_at
                  type: TIMESTAMP

  - changeSet:
      id: 2026-09-11-create-table-document-workflow-log
      author: quyet
      preConditions:
        onFail: MARK_RAN
        sqlCheck:
          expectedResult: 0
          sql: "SELECT COUNT(*) FROM information_schema.tables WHERE LOWER(table_name) = 'document_workflow_logs'"
      changes:
        - createTable:
            tableName: document_workflow_logs
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: document_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: action
                  type: VARCHAR(100)
              - column:
                  name: actor
                  type: VARCHAR(100)
              - column:
                  name: actor_username
                  type: VARCHAR(100)
              - column:
                  name: actor_role
                  type: VARCHAR(100)
              - column:
                  name: comment
                  type: TEXT
              - column:
                  name: ip_address
                  type: VARCHAR(100)
              - column:
                  name: created_at
                  type: TIMESTAMP

  - changeSet:
