databaseChangeLog:
  - changeSet:
      id: e4f5a6b7-8c9d-4e0f-9a1b-2c3d4e5f6a70
      author: luannv
      changes:
        - createTable:
            tableName: refresh_tokens
            remarks: Lưu jti của refresh token để quản lý vòng đời (rotation/revocation)
            columns:
              - column:
                  name: id
                  type: BIGINT
                  defaultValueComputed: nextval('hibernate_sequence')
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: BIGINT
                  remarks: FK tới user_logins - chủ sở hữu refresh token
                  constraints:
                    nullable: false
              - column:
                  name: rt
                  type: VARCHAR(36)
                  remarks: jti của refresh token (JWT)
                  constraints:
                    nullable: false
              - column:
                  name: expires_at
                  type: TIMESTAMP WITH TIME ZONE
                  remarks: Thời điểm hết hạn refresh token
                  constraints:
                    nullable: false
              - column:
                  name: is_revoked
                  type: BOOLEAN
                  defaultValueBoolean: false
                  remarks: Cờ thu hồi (true khi đã rotate hoặc logout)
                  constraints:
                    nullable: false

        - addUniqueConstraint:
            constraintName: uq_refresh_tokens_rt
            tableName: refresh_tokens
            columnNames: rt

        - createIndex:
            indexName: idx_refresh_tokens_user_revoked
            tableName: refresh_tokens
            columns:
              - column:
                  name: user_id
              - column:
                  name: is_revoked

        - addForeignKeyConstraint:
            baseTableName: refresh_tokens
            baseColumnNames: user_id
            constraintName: fk_refresh_tokens_user
            referencedTableName: user_logins
            referencedColumnNames: id
