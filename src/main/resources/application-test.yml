spring:
  datasource:
    url: jdbc:h2:mem:eoffice-test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/master-test.yml

server:
  port: 8888

logging:
  level:
    liquibase: DEBUG

eoffice:
  jwt:
    issuer: eoffice-be-test
    secret-key: eoffice-be-jwt-secret-fixed-for-all-environments-2026
    access-token-ttl: PT15M
    refresh-token-ttl: P30D
    auth-rate-limit: 100
    auth-rate-window-seconds: 300
  upload:
    dir: target/test-uploads
    max-file-size-bytes: 26214400
    allowed-extensions:
      - docx
      - pdf
      - DOCX
      - PDF

