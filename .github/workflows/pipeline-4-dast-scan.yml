# Pipeline 4: Dynamic Application Security Testing (DAST) with OWASP ZAP.
# Source: DevSecOps_EOffice_Scopus_Q2_Upgrade.docx — Chuong 3 (khung DAST) + Chuong 5 (YAML).
# Fixes vs. the draft in Table 6 (see commit message / PR description):
#   1. workflow_run.workflows uses the real workflow NAME "Pipeline 2: Dev Secure Deploy"
#      (matching `name:` in pipeline-2-dev-secure-deploy.yml), not the deploy job label —
#      otherwise this workflow NEVER triggers.
#   2. Target is the staging app root from secret STAGING_BASE_URL, NOT http://localhost:8080
#      (GitHub-hosted runners have no app on localhost; staging lives on Heroku).
#   3. `if:` covers schedule + workflow_dispatch too (on those events
#      github.event.workflow_run is null, so the draft condition would skip every run).
#   4. Added JSON report (-J) for machine-readable evidence, artifact upload (always),
#      timeout, concurrency, least-privilege permissions.
# Required secrets (fallback chain): STAGING_BASE_URL preferred (app root, e.g. https://<app>.herokuapp.com, no trailing slash);
# fallback HEALTH_CHECK_URL (full https://<app>.herokuapp.com/actuator/health) -> strip suffix /actuator/health to derive app root.
# Fails only when both are empty.
# Follow-ups from Table 3 not yet in this baseline (need ZAP context + auth script +
# OpenAPI import): authenticated scan (POST /api/v1/auth/login -> Bearer JWT),
# ZAP context file with Included/Excluded URLs, SARIF import to code scanning.

name: "Pipeline 4: Dynamic Application Security Testing (DAST)"

on:
  workflow_run:
    workflows: ["Pipeline 2: Dev Secure Deploy"]
    types: [completed]
  schedule:
    - cron: "0 3 * * *" # 10:00 ICT (UTC+7) — offset from Pipeline 3 (01:00 ICT)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dast-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zap_dast_scan:
    name: "OWASP ZAP Dynamic Security Scan"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name != 'workflow_run' }}

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Verify Staging Environment Health
        env:
          STAGING_BASE_URL: ${{ secrets.STAGING_BASE_URL }}
          HEALTH_CHECK_URL: ${{ secrets.HEALTH_CHECK_URL }}
        run: |
          set -euo pipefail
          APP_ROOT="${STAGING_BASE_URL:-}"
          if [ -z "${APP_ROOT}" ] && [ -n "${HEALTH_CHECK_URL:-}" ]; then
            APP_ROOT="${HEALTH_CHECK_URL%/actuator/health}"
          fi
          if [ -z "${APP_ROOT}" ]; then
            echo "::error::Missing both secrets STAGING_BASE_URL and HEALTH_CHECK_URL (need app root or full /actuator/health URL)"
            exit 1
          fi
          echo "Checking staging health at ${APP_ROOT}/actuator/health ..."
          curl --fail --silent --show-error "${APP_ROOT}/actuator/health" > /dev/null
          echo "APP_ROOT=${APP_ROOT}" >> "$GITHUB_ENV"

      - name: Run OWASP ZAP Baseline Scan (DAST)
        uses: zaproxy/action-baseline@66042c8e7e24680119199a017e5b0e8603bf4dae # v0.12.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          docker_name: 'ghcr.io/zaproxy/zaproxy:stable'
          target: ${{ env.APP_ROOT }}
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-a -j -J zap_report.json -r zap_report.html -x zap_report.xml -z "-config api.disablekey=true"'
          fail_action: false

      - name: Gate — fail only on HIGH/CRITICAL alerts
        if: always()
        run: |
          set -euo pipefail
          if [ ! -f zap_report.xml ]; then
            echo "::error::ZAP report not found"
            exit 1
          fi
          high=$(grep -c '<riskdesc>High</riskdesc>' zap_report.xml || true)
          critical=$(grep -c '<riskdesc>Critical</riskdesc>' zap_report.xml || true)
          echo "ZAP HIGH alerts: ${high}"
          echo "ZAP CRITICAL alerts: ${critical}"
          if [ "${high}" -gt 0 ] || [ "${critical}" -gt 0 ]; then
            echo "[FAIL] Found HIGH or CRITICAL alerts"
            exit 1
          fi
          echo "[PASS] No HIGH or CRITICAL alerts"

      - name: Upload ZAP reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dast-zap-reports-${{ github.run_id }}
          path: zap_report.*
          if-no-files-found: warn
