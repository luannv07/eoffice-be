# Pipeline 4: Dynamic Application Security Testing (DAST) with OWASP ZAP.
# Source: DevSecOps_EOffice_Scopus_Q2_Upgrade.docx — Chuong 3 (khung DAST) + Chuong 5 (YAML),
# upgraded from the unauthenticated baseline to an authenticated JWT scan
# (kich-ban-owasp-zap-dast-jwt-epu.docx).
#
# Behaviour:
#   1. workflow_run.workflows uses the real workflow NAME "Pipeline 2: Dev Secure Deploy"
#      (matching `name:` in pipeline-2-dev-secure-deploy.yml), not the deploy job label.
#   2. Target is the staging app root from secret STAGING_BASE_URL, falling back to
#      HEALTH_CHECK_URL with the /actuator/health suffix stripped.
#   3. `if:` covers schedule + workflow_dispatch too (on those events
#      github.event.workflow_run is null).
#   4. When DAST_STAGING_USER / DAST_STAGING_PASS are configured the job runs the
#      OWASP ZAP Automation Framework plan (.zap/zap-jwt-config.yaml) with a real JWT
#      context; otherwise it degrades to the previous unauthenticated baseline scan so
#      scheduled runs never break while the DAST account is being provisioned.
#
# Required secrets:
#   STAGING_BASE_URL   (preferred) staging app root, e.g. https://<host>/api/v1, no trailing slash
#   HEALTH_CHECK_URL   (fallback)  full https://<host>/api/v1/actuator/health
#   DAST_STAGING_USER  dedicated staging account, profileCompleted = true (NOT a real admin / PKI account)
#   DAST_STAGING_PASS  password of that account

name: "Pipeline 4: Dynamic Application Security Testing (DAST)"

on:
  workflow_run:
    workflows: ["Pipeline 2: Dev Secure Deploy"]
    types: [completed]
  schedule:
    - cron: "0 3 * * *" # 10:00 ICT (UTC+7) — offset from Pipeline 3 (01:00 ICT)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dast-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zap_dast_scan:
    name: "OWASP ZAP Dynamic Security Scan"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name != 'workflow_run' }}

    env:
      DAST_STAGING_USER: ${{ secrets.DAST_STAGING_USER }}
      DAST_STAGING_PASS: ${{ secrets.DAST_STAGING_PASS }}

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4
        with:
          # On workflow_run, scan the commit Pipeline 2 actually deployed, not whatever
          # happens to sit on the default branch. On schedule/dispatch github.sha is used.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Record scanned commit
        run: |
          set -euo pipefail
          echo "DAST_SCANNED_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "DAST_DEPLOYED_COMMIT=${{ github.event.workflow_run.head_sha || 'n/a (schedule/dispatch)' }}" >> "$GITHUB_ENV"
          echo "Scanned commit: $(git rev-parse HEAD)"
          echo "Trigger: ${GITHUB_EVENT_NAME}"

      - name: Fix permissions for ZAP container
        run: chmod 777 .

      - name: Verify Staging Environment Health
        env:
          STAGING_BASE_URL: ${{ secrets.STAGING_BASE_URL }}
          HEALTH_CHECK_URL: ${{ secrets.HEALTH_CHECK_URL }}
        run: |
          set -euo pipefail
          APP_ROOT="${STAGING_BASE_URL:-}"
          if [ -z "${APP_ROOT}" ] && [ -n "${HEALTH_CHECK_URL:-}" ]; then
            APP_ROOT="${HEALTH_CHECK_URL%/actuator/health}"
          fi
          if [ -z "${APP_ROOT}" ]; then
            echo "::error::Missing both secrets STAGING_BASE_URL and HEALTH_CHECK_URL (need app root or full /actuator/health URL)"
            exit 1
          fi
          echo "Checking staging health at ${APP_ROOT}/actuator/health ..."
          curl --fail --silent --show-error "${APP_ROOT}/actuator/health" > /dev/null
          echo "APP_ROOT=${APP_ROOT}" >> "$GITHUB_ENV"

      - name: Detect DAST Authentication Mode
        id: dast_mode
        run: |
          if [ -n "${DAST_STAGING_USER:-}" ] && [ -n "${DAST_STAGING_PASS:-}" ]; then
            echo "authenticated=true" >> "$GITHUB_OUTPUT"
            echo "Authenticated JWT scan enabled (DAST_STAGING_USER / DAST_STAGING_PASS are set)."
          else
            echo "authenticated=false" >> "$GITHUB_OUTPUT"
            echo "::warning::DAST_STAGING_USER / DAST_STAGING_PASS are not configured; falling back to the unauthenticated baseline scan."
          fi

      - name: Prepare ZAP Workspace
        if: steps.dast_mode.outputs.authenticated == 'true'
        run: |
          set -euo pipefail
          mkdir -p zap_workspace/reports
          cp .zap/zap-jwt-config.yaml zap_workspace/zap-jwt-config.yaml
          chmod -R 777 zap_workspace
          echo "DAST_TARGET_URL=${APP_ROOT}" >> "$GITHUB_ENV"

      - name: Run OWASP ZAP Authenticated Scan (JWT)
        if: steps.dast_mode.outputs.authenticated == 'true'
        run: |
          set -euo pipefail
          # ZAP AF exits 0 on success, 1 on error and 2 on (warning-level) findings.
          # Exit 2 (warning-only) is expected and is not a scan failure: the
          # pipeline gate below (report must exist + HIGH/CRITICAL count + URL sanity)
          # stays the authority. Treating exit 2 as success keeps the step green when
          # the scan ran correctly but raised only Low/Informational alerts.
          set +e
          docker run --rm \
            -v "$PWD/zap_workspace:/zap/wrk:rw" \
            -e DAST_TARGET_URL \
            -e DAST_STAGING_USER \
            -e DAST_STAGING_PASS \
            ghcr.io/zaproxy/zaproxy:stable \
            zap.sh -cmd -autorun /zap/wrk/zap-jwt-config.yaml
          rc=$?
          set -e
          if [ "$rc" -eq 2 ]; then rc=0; fi
          exit $rc

      - name: Run OWASP ZAP Baseline Scan (unauthenticated fallback)
        if: steps.dast_mode.outputs.authenticated != 'true'
        uses: zaproxy/action-baseline@66042c8e7e24680119199a017e5b0e8603bf4dae # v0.12.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          docker_name: 'ghcr.io/zaproxy/zaproxy:stable'
          target: ${{ env.APP_ROOT }}
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-a -j -J zap_report.json -r zap_report.html -x zap_report.xml -z "-config api.disablekey=true"'
          fail_action: false

      - name: Collect sanitized HTTP evidence (JWT scan)
        if: always() && steps.dast_mode.outputs.authenticated == 'true'
        run: |
          set -euo pipefail
          # ZAP AF can only export a raw HAR + Sites Tree YAML. This step turns them
          # into sanitized, upload-safe audit artifacts (no headers, no bodies, no
          # query values) and fails if a credential pattern leaks into the output.
          python3 .zap/scripts/zap_http_evidence.py \
            --har zap_workspace/http_raw.har \
            --sites-tree zap_workspace/sites_tree_raw.yaml \
            --report-dir zap_workspace/reports \
            --out-dir zap_workspace/evidence \
            --target-url "${APP_ROOT}" \
            --run-id "${GITHUB_RUN_ID}" \
            --commit "${DAST_SCANNED_COMMIT:-${GITHUB_SHA}}" \
            --workflow "${GITHUB_WORKFLOW}"

      - name: Remove raw ZAP exports (never upload credentials)
        if: always()
        run: |
          set -euo pipefail
          # The raw HAR contains Authorization headers, refresh-token cookies and
          # response bodies, so it is deleted from the runner right after parsing.
          rm -f zap_workspace/http_raw.har zap_workspace/sites_tree_raw.yaml
          find zap_workspace -name '*.har' -print
          echo "Raw HAR/Sites Tree exports removed."

      - name: Validate artifacts before upload
        if: always() && steps.dast_mode.outputs.authenticated == 'true'
        run: |
          set -euo pipefail
          # Fail closed: if evidence is missing, a credential pattern is present, or
          # any .har survived under the upload root, the job fails instead of
          # publishing unsafe artifacts.
          python3 .zap/scripts/zap_http_evidence.py \
            --validate-only \
            --out-dir zap_workspace/evidence \
            --report-dir zap_workspace/reports \
            --har-free-root zap_workspace
          echo "EVIDENCE_VALIDATED=true" >> "$GITHUB_ENV"

      - name: Gate — fail only on HIGH/CRITICAL alerts
        if: always()
        run: |
          set -euo pipefail
          REPORT=""
          if [ -f zap_workspace/reports/zap_report.json ]; then
            REPORT="zap_workspace/reports/zap_report.json"
          elif [ -f zap_report.json ]; then
            REPORT="zap_report.json"
          fi
          if [ -z "${REPORT}" ]; then
            echo "::error::ZAP report not found"
            exit 1
          fi
          # Sanity: the scan must have actually reached the protected API surface.
          # An empty URL list means the JWT context or the OpenAPI import silently
          # produced nothing, which would otherwise look like a clean scan.
          URLS=0
          if [ -f zap_workspace/reports/scanned_urls.txt ]; then
            URLS=$(grep -c "http" zap_workspace/reports/scanned_urls.txt || true)
          fi
          echo "ZAP requested URLs: ${URLS}"
          if [ "${URLS}" -lt 10 ]; then
            echo "::error::Authenticated scan reached only ${URLS} URLs - JWT context or OpenAPI import did not work"
            exit 1
          fi
          # The previous gate grepped '<riskdesc>High</riskdesc>' against the XML
          # report, but ZAP always formats that element as '<risk> (<confidence>)',
          # e.g. '<riskdesc>High (Medium)</riskdesc>' - so the pattern could never
          # match and the High/Critical gate never fired. Parse the JSON report and
          # compare the risk prefix instead.
          python3 - "${REPORT}" <<'PY'
          import json
          import sys
          from collections import Counter

          with open(sys.argv[1], encoding="utf-8") as handle:
              report = json.load(handle)

          types = Counter()
          instances = Counter()
          for site in report.get("site", []):
              for alert in site.get("alerts", []):
                  risk = str(alert.get("riskdesc", "Unknown")).split()[0].lower()
                  types[risk] += 1
                  instances[risk] += len(alert.get("instances") or [])

          for risk in ("critical", "high", "medium", "low", "informational", "unknown"):
              if types.get(risk):
                  print(f"ZAP {risk.upper()} alert types: {types[risk]} (instances: {instances[risk]})")

          blocking = types.get("high", 0) + types.get("critical", 0)
          if blocking:
              print(f"[FAIL] Found {blocking} HIGH/CRITICAL alert type(s)")
              sys.exit(1)
          print("[PASS] No HIGH or CRITICAL alerts")
          PY

      - name: Summarize DAST Findings
        if: always()
        run: |
          set -euo pipefail
          REPORT=""
          if [ -f zap_workspace/reports/zap_report.json ]; then
            REPORT="zap_workspace/reports/zap_report.json"
          elif [ -f zap_report.json ]; then
            REPORT="zap_report.json"
          fi
          if [ -z "${REPORT}" ]; then
            echo "No JSON report found; skipping summary."
            exit 0
          fi
          python3 - "${REPORT}" <<'PY'
          import json
          import sys
          from collections import Counter

          with open(sys.argv[1], encoding="utf-8") as handle:
              report = json.load(handle)

          counts = Counter()
          for site in report.get("site", []):
              for alert in site.get("alerts", []):
                  counts[str(alert.get("riskdesc", "Unknown")).split(" ")[0]] += 1

          print("DAST alert summary (one entry per alert type):")
          for risk in ("High", "Medium", "Low", "Informational"):
              print(f"  {risk}: {counts.get(risk, 0)}")
          print(f"  Total: {sum(counts.values())}")
          PY

      - name: Upload ZAP Reports and sanitized HTTP evidence
        if: always() && (steps.dast_mode.outputs.authenticated != 'true' || env.EVIDENCE_VALIDATED == 'true')
        uses: actions/upload-artifact@v4
        with:
          name: dast-zap-reports-${{ github.run_id }}
          # Only sanitized evidence and (redacted) reports are published. The raw HAR
          # was deleted above and the validator checked the upload root for leftovers.
          path: |
            zap_workspace/reports/
            zap_workspace/evidence/
            zap_report.*
          if-no-files-found: warn
          retention-days: 30
