name: "Pipeline 3: Scheduled Deep Security Scan"

on:
  schedule:
    - cron: "0 18 * * *" # 01:00 ICT (UTC+7)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deep-security-scan:
    name: Deep Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout source
        uses: actions/checkout@v4

      - name: 2. Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: 2. Cache OWASP Dependency-Check DB
        uses: actions/cache@v4
        with:
          path: ~/.cache/dependency-check
          key: owasp-db-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            owasp-db-${{ runner.os }}-

      - name: 3. Install Trivy CLI
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y wget gnupg lsb-release
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | \
            gpg --dearmor | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" | \
            sudo tee /etc/apt/sources.list.d/trivy.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y trivy
          trivy --version

      - name: 4. Full Trivy scan (filesystem)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p security-reports
          trivy fs . \
            --scanners vuln,misconfig,secret,license \
            --format json \
            --output security-reports/trivy-full.json \
            --ignore-unfixed \
            --ignorefile .trivyignore \
            --exit-code 0

      - name: 5. Generate SBOM (CycloneDX)
        shell: bash
        run: |
          set -euo pipefail
          trivy fs . \
            --format cyclonedx \
            --output security-reports/sbom-cyclonedx.json \
            --exit-code 0

      - name: 6. Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deep-security-reports-${{ github.run_id }}
          path: security-reports/
          if-no-files-found: warn

      - name: 7. OWASP Dependency Check
        run: |
          mkdir -p security-reports
          mvn -B org.owasp:dependency-check-maven:check \
            -Dformat=JSON \
            -DoutputDirectory=security-reports \
            -DdataDirectory=$HOME/.cache/dependency-check \
            -DnvdApiKey=${{ secrets.NVD_API_KEY }} \
            -DsuppressionFile=owasp-suppression.xml \
            -DfailBuildOnCVSS=9

      - name: 8. Fail if CRITICAL or CVSS >= 9
        shell: bash
        run: |
          set -euo pipefail

          critical_count=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "CRITICAL")] | length' security-reports/trivy-full.json)
          cvss9_count=$(jq '[.Results[]?.Vulnerabilities[]? | .CVSS? // {} | to_entries[]? | .value.V3Score? | select(. >= 9)] | length' security-reports/trivy-full.json)

          echo "Trivy CRITICAL count: ${critical_count}"
          echo "Trivy CVSS >= 9 count: ${cvss9_count}"

          if [ "${critical_count}" -gt 0 ] || [ "${cvss9_count}" -gt 0 ]; then
            echo "[FAIL] Found CRITICAL vulnerabilities or CVSS >= 9"
            exit 1
          fi

          echo "[PASS] No CRITICAL vulnerability and no CVSS >= 9 found in Trivy report."
