name: "Pipeline 2: Dev Secure Deploy"
on:
  push:
    branches:
      - dev

permissions:
  contents: read

concurrency:
  group: dev-secure-deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: eoffice-be
  CONTAINER_NAME: eoffice-be
  APP_PORT: 8080
jobs:
  build-scan-push-deploy:
    name: Build, Scan, Push and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Build Spring Boot JAR
        run: mvn clean package -DskipTests

      - name: Runner context
        run: |
          whoami
          pwd
          uname -a
          docker --version
          docker compose version

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:dev \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }} .

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@v0.25.0
        with:
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:dev
          format: table
          severity: CRITICAL,HIGH
          exit-code: 1
          ignore-unfixed: true

      - name: Push Docker image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:dev
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            set -euo pipefail
            cd "${{ secrets.DEPLOY_PATH }}"

            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

            cat > .env.deploy <<'EOF'
            IMAGE_TAG=${{ github.sha }}
            DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}
            IMAGE_NAME=${{ env.IMAGE_NAME }}
            EOF

            docker compose --env-file .env.deploy pull
            docker compose --env-file .env.deploy up -d --remove-orphans
            docker image prune -f

      - name: Health check
        env:
          HEALTH_CHECK_URL: ${{ secrets.HEALTH_CHECK_URL }}
        run: |
          for i in {1..15}; do
            if curl --fail --silent --show-error "$HEALTH_CHECK_URL" > /dev/null; then
              echo "Health check passed"
              exit 0
            fi
            echo "Health check attempt $i/15 failed, retrying in 10s..."
            sleep 10
          done
          echo "Health check failed after 15 attempts"
          exit 1
