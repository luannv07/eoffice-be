name: "Pipeline 2: Dev Secure Deploy"

on:
  push:
    branches:
      - dev

permissions:
  contents: read

concurrency:
  group: dev-secure-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-scan-push-deploy:
    name: Build, Scan, Push and Deploy to Heroku
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Build Spring Boot JAR
        run: mvn clean package -DskipTests

      - name: Build Docker image
        run: |
          docker build \
            -t registry.heroku.com/${{ secrets.HEROKU_APP_NAME }}/web:latest \
            -t registry.heroku.com/${{ secrets.HEROKU_APP_NAME }}/web:${{ github.sha }} .

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@v0.25.0
        with:
          image-ref: registry.heroku.com/${{ secrets.HEROKU_APP_NAME }}/web:${{ github.sha }}
          format: table
          severity: CRITICAL
          exit-code: 1
          ignore-unfixed: true

      - name: Login to Heroku Container Registry
        run: |
          echo "${{ secrets.HEROKU_API_KEY }}" | docker login registry.heroku.com -u _ --password-stdin

      - name: Push Docker image to Heroku
        run: |
          docker push registry.heroku.com/${{ secrets.HEROKU_APP_NAME }}/web:latest
          docker push registry.heroku.com/${{ secrets.HEROKU_APP_NAME }}/web:${{ github.sha }}

      - name: Install Heroku CLI
        run: |
          curl -s https://cli-assets.heroku.com/install.sh | sh

      - name: Release to Heroku
        run: heroku container:release web -a ${{ secrets.HEROKU_APP_NAME }}
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}

      - name: Health check
        env:
          HEALTH_CHECK_URL: ${{ secrets.HEALTH_CHECK_URL }}
        run: |
          for i in {1..15}; do
            if curl --fail --silent --show-error "$HEALTH_CHECK_URL" > /dev/null; then
              echo "Health check passed"
              exit 0
            fi
            echo "Health check attempt $i/15 failed, retrying in 10s..."
            sleep 10
          done
          echo "Health check failed after 15 attempts"
          exit 1
