name: "Pipeline 2: Dev Secure Deploy"

on:
  push:
    branches:
      - dev

permissions:
  contents: read

concurrency:
  group: dev-secure-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-scan-push-deploy:
    name: Build, Scan, Push and Deploy to Heroku
    # Pinned on purpose: ubuntu-latest moved to Ubuntu 26.04, whose Docker exports OCI
    # manifests that the Heroku container registry rejects ("unsupported"). See the
    # comment on the "4. Build Docker image" step.
    runs-on: ubuntu-24.04

    steps:
      - name: 1. Checkout source
        uses: actions/checkout@v4

      - name: 2. Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: 3. Build Spring Boot JAR
        # Tests run in Pipeline 1 PR Gate using isolated PKI fixtures.
        # Keep -DskipTests here to avoid repeating that suite during deployment.
        run: mvn clean package -DskipTests

      - name: 4. Build Docker image
        # The ubuntu-latest runner image migrated to Ubuntu 26.04 (runner-image release
        # 20261018.168). Its Docker uses the containerd image store, so `docker build`
        # now exports an OCI manifest plus an attestation manifest. The Heroku container
        # registry only accepts a plain Docker schema2 manifest and rejects the OCI one
        # with "error from registry: unsupported" (all layers push fine, only the
        # manifest upload fails). Forcing provenance/sbom off keeps the image in the
        # Docker format, and pinning the runner to the image that was working before
        # (ubuntu-24.04, release 20261012.334) keeps the schema2 output deterministic.
        run: |
          docker build \
            --provenance=false --sbom=false \
            -t registry.heroku.com/${{ secrets.HEROKU_APP_NAME }}/web:latest \
            -t registry.heroku.com/${{ secrets.HEROKU_APP_NAME }}/web:${{ github.sha }} .

      - name: 5. Login to Heroku Container Registry
        run: |
          echo "${{ secrets.HEROKU_API_KEY }}" | docker login registry.heroku.com -u _ --password-stdin

      - name: 6. Push Docker image to Heroku
        run: |
          docker push registry.heroku.com/${{ secrets.HEROKU_APP_NAME }}/web:latest
          docker push registry.heroku.com/${{ secrets.HEROKU_APP_NAME }}/web:${{ github.sha }}

      - name: 7. Install Heroku CLI
        run: |
          curl -s https://cli-assets.heroku.com/install.sh | sh

      - name: 8. Release to Heroku
        run: heroku container:release web -a ${{ secrets.HEROKU_APP_NAME }}
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}

      - name: 9. Health check
        env:
          HEALTH_CHECK_URL: ${{ secrets.HEALTH_CHECK_URL }}
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
        run: |
          for i in {1..15}; do
            if curl --fail --silent --show-error "$HEALTH_CHECK_URL" > /dev/null; then
              echo "Health check passed"
              exit 0
            fi
            echo "Health check attempt $i/15 failed, retrying in 10s..."
            sleep 10
          done
          echo "Health check failed after 15 attempts"
          heroku logs --tail 200 -a ${{ secrets.HEROKU_APP_NAME }} > heroku-failure.log 2>&1 || true
          cat heroku-failure.log || true
          exit 1

      - name: Upload Heroku logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: heroku-failure-log
          path: heroku-failure.log
          if-no-files-found: warn
