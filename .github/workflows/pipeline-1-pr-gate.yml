name: "Pipeline 1: PR Gate"

on:
  pull_request:
    branches:
      - dev
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build-test:
    name: "Build & Test"
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 2. Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "maven"

      - name: 3. Build (Tests + Static Analysis)
        run: mvn -B clean verify

  security-scan:
    name: "Security Scan (Trivy + TruffleHog)"
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout source
        uses: actions/checkout@v4

      - name: 2. Build Docker image
        run: docker build -t eoffice-be:pr-${{ github.sha }} .

      - name: 3a. Trivy – Full report (informational)
        uses: aquasecurity/trivy-action@v0.25.0
        with:
          image-ref: eoffice-be:pr-${{ github.sha }}
          format: table
          exit-code: 0
          severity: CRITICAL,HIGH

      - name: 3b. Trivy – Gate on CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@v0.25.0
        with:
          image-ref: eoffice-be:pr-${{ github.sha }}
          format: table
          scanners: vuln
          exit-code: 1
          severity: CRITICAL
          ignore-unfixed: true

      - name: 4. Secret Scan (TruffleHog)
        uses: trufflesecurity/trufflehog@main
        continue-on-error: true
        with:
          extra_args: --results=verified,unknown

  sonar:
    name: "SonarQube Scan"
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 2. Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "maven"

      - name: 3. SonarQube Scan + Quality Gate
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn -B compile
          mvn -B sonar:sonar \
            -Dsonar.projectKey=luannv07_eoffice-be \
            -Dsonar.organization=luannv07 \
            -Dsonar.host.url=${{ secrets.SONAR_HOST_URL }} \
            -Dsonar.token=${{ secrets.SONAR_TOKEN }} \
            -Dsonar.java.binaries=target/classes

  ai-review:
    name: "AI Code Review"
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 2. Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: 3. Checkout repo eoffice-ai-review
        uses: actions/checkout@v4
        with:
          repository: "luannv07/eoffice-ai-review"
          path: "eoffice-ai-review"
          token: ${{ secrets.GH_PAT }}

      - name: 4. Install AI Reviewer dependencies
        run: npm --prefix eoffice-ai-review install

      - name: 5. AI Code Review (Hy3/Groq/OpenRouter/Gemini/17WTF)
        run: |
          node \
            -r ./eoffice-ai-review/node_modules/ts-node/register \
            ./eoffice-ai-review/ai_service.ts
        env:
          GROQ_API_KEYS: ${{ secrets.GROQ_API_KEYS }}
          GROQ_MODELS: ${{ secrets.GROQ_MODELS }}
          OPENROUTER_API_KEYS: ${{ secrets.OPENROUTER_API_KEYS }}
          OPENROUTER_MODELS: ${{ secrets.OPENROUTER_MODELS }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          GEMINI_MODELS: ${{ secrets.GEMINI_MODELS }}
          SEVEN_TEEN_WTF_API_KEYS: ${{ secrets.SEVEN_TEEN_WTF_API_KEYS }}
          SEVEN_TEEN_WTF_MODELS: ${{ secrets.SEVEN_TEEN_WTF_MODELS }}
          HY3_API_KEYS: ${{ secrets.HY3_API_KEYS }}
          HY3_MODELS: ${{ secrets.HY3_MODELS }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
          GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITHUB_EVENT_ACTION: ${{ github.event.action }}
          GITHUB_BOT_LOGIN: github-actions[bot]
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
