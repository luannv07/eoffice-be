name: "Pipeline 1: PR Gate"

on:
  pull_request:
    branches:
      - dev
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-gate:
    name: "PR Gate - Security & Code Review"
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 2. Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "maven"

      - name: 3. Build (Tests + Static Analysis)
        run: mvn -B clean verify

      - name: 4. Secret Scan (TruffleHog)
        uses: trufflesecurity/trufflehog@main
        continue-on-error: true
        with:
          extra_args: --results=verified,unknown

      - name: 5. SonarQube Scan + Quality Gate
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn -B sonar:sonar \
            -Dsonar.projectKey=luannv07_eoffice-be \
            -Dsonar.organization=luannv07 \
            -Dsonar.host.url=${{ secrets.SONAR_HOST_URL }} \
            -Dsonar.token=${{ secrets.SONAR_TOKEN }} \
            -Dsonar.java.binaries=target/classes

      - name: 6. Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: 7. Checkout repo eoffice-ai-review
        uses: actions/checkout@v4
        with:
          repository: "luannv07/eoffice-ai-review"
          path: "eoffice-ai-review"
          token: ${{ secrets.GH_PAT }}

      - name: 8. Install AI Reviewer dependencies
        run: npm --prefix eoffice-ai-review install

      - name: 9. AI Code Review (Groq/OpenRouter)
        run: |
          node \
            -r ./eoffice-ai-review/node_modules/ts-node/register \
            ./eoffice-ai-review/ai_service.ts
        env:
          GROQ_API_KEYS: ${{ secrets.GROQ_API_KEYS }}
          GROQ_MODELS: ${{ secrets.GROQ_MODELS }}
          OPENROUTER_API_KEYS: ${{ secrets.OPENROUTER_API_KEYS }}
          OPENROUTER_MODELS: ${{ secrets.OPENROUTER_MODELS }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
          GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITHUB_EVENT_ACTION: ${{ github.event.action }}
          GITHUB_BOT_LOGIN: github-actions[bot]
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 10. Finish
        if: always()
        run: |
          echo "[DONE] Pipeline 1 (PR Gate) finished."
