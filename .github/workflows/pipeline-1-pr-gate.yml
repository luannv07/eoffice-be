name: "Pipeline 1: PR Gate (Security & Code Review)"

on:
  pull_request:
    branches:
      - dev

permissions:
  contents: read
  pull-requests: write

jobs:
  security-and-review:
    name: "Quét Bảo Mật & AI Code Review"
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout Mã Nguồn Backend
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # TruffleHog cần full history

      - name: 2. Secret Scan (Chặn lộ mật khẩu/Key)
        uses: trufflesecurity/trufflehog@main
        continue-on-error: true
        with:
          extra_args: --results=verified,unknown # ✅ cách mới, không cần base/head SHA

      - name: 3. Dependency Scan (Quét thư viện lỗi thời)
        uses: dependency-check/dependency-check-action@main
        continue-on-error: true
        with:
          project: "eoffice-backend"
          path: "."
          format: "HTML"
          out: "dependency-check-report"

      - name: 4. Thiết lập môi trường Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: 5. Kéo mã nguồn công cụ AI Reviewer từ repo độc lập
        uses: actions/checkout@v4
        with:
          repository: "luannv07/eoffice-ai-review"
          path: "eoffice-ai-review"
          token: ${{ secrets.GH_PAT }}

      - name: 6. Cài đặt thư viện & Kích hoạt AI Reviewer
        run: |
          cd eoffice-ai-review
          npm install
          npm run start
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
      - name: 7. Cổ Vũ Tinh Thần 🎉
        if: always()
        run: |
          echo "╔════════════════════════════════════════╗"
          echo "║                                        ║"
          echo "║   💪 Cố lên bạn ơi! Code của bạn      ║"
          echo "║      đang được bảo vệ tận răng rồi!   ║"
          echo "║                                        ║"
          echo "║   🔥 Keep pushing, stay secure! 🔒    ║"
          echo "║                                        ║"
          echo "╚════════════════════════════════════════╝"
